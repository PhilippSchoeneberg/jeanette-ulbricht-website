# Runs ruff (lint + format check) and the pytest suite (backend, translation checks and
# Playwright browser tests).
#
# - On every pull request into development or main: the "tests" check must pass before the
#   pull request can be merged (required status check in the branch rulesets, see
#   doc/development.md).
# - After a merge (push) to development or main: confirms the merged result still passes.
# - Manually from the Actions tab (workflow_dispatch).

name: Tests

on:
  pull_request:
    branches: [development, main]
  push:
    branches: [development, main]
  workflow_dispatch:

# A newer push to the same pull request or branch cancels the older, still running run.
concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Actions are pinned to full commit SHAs (a tag like @v4 can be moved to other code);
# Dependabot (.github/dependabot.yml) proposes updates.
permissions:
  contents: read

jobs:
  tests:
    # This name is the status check that the branch rulesets require. Keep it stable.
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6.8.0
        with:
          # Same uv version as FormelX; bump both together.
          version: "0.13.7"
          # Oldest supported version (requires-python in pyproject.toml).
          python-version: "3.11"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lock file is up to date
        run: uv lock --check

      # Linting runs in this job (not a separate one) so the existing required "tests" check
      # covers it too.
      - name: Lint (ruff)
        run: uv run ruff check --output-format=github .

      - name: Check formatting (ruff)
        run: uv run ruff format --check .

      # Chromium for the browser tests in tests/e2e (cached per locked Playwright version),
      # plus the system libraries it needs.
      - name: Cache Playwright browser
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('uv.lock') }}

      - name: Install Playwright browser
        run: uv run playwright install --with-deps chromium

      - name: Run tests
        run: uv run pytest
